name: Run MALBEC on PTB-XL
on:
  workflow_dispatch:
  push:
    paths: ['malbec/*.py', 'malbec/requirements.txt', '.github/workflows/ptbxl.yml']
permissions:
  contents: read
jobs:
  infer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: malbec/requirements.txt
      - name: Install CPU inference environment
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r malbec/requirements.txt
      - name: Fetch versioned weights
        run: |
          filename=finetuned_18d5a8abc508439a82786289b8f67ccc.ckpt
          curl -fsSL --retry 2 --max-time 400 -o "$filename" "https://github.com/joongwha/ai-model/releases/download/malbec-zenodo-2.0.0/$filename" ||
            curl -fsSL --retry 2 --max-time 400 -o "$filename" "https://zenodo.org/records/19627196/files/$filename?download=1"
          echo "293f5f9b5317c279172d9f1f3b8dadc67d23513ccc058e93db15352d8b5fc986  $filename" | sha256sum --check -
      - name: Select a case, verify published scores, run inference
        run: python malbec/ptbxl_case.py --checkpoint finetuned_18d5a8abc508439a82786289b8f67ccc.ckpt --output results
      - uses: actions/upload-artifact@v4
        with:
          name: malbec-ptbxl-result
          if-no-files-found: error
          path: |
            results/selection.json
            results/predictions.json
            results/ptbxl_ecg.png
